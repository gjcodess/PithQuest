<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Coconut Outer Shell Gradient -->
    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854d0e" />
      <stop offset="100%" stop-color="#582900" />
    </linearGradient>

    <!-- Golden Cracker Gradient -->
    <linearGradient id="crackerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Sparkle / Lab Star Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-opacity="0.35" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Base Circular Icon Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Coconut Half Shell Background -->
  <g filter="url(#shadow)">
    <!-- Coconut brown outer shell -->
    <ellipse cx="26" cy="36" rx="17" ry="17" fill="url(#shellGrad)" />
    <!-- White coconut meat & pith -->
    <ellipse cx="26" cy="35" rx="13.5" ry="13.5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <!-- Inner soft core / pith cavity -->
    <ellipse cx="26" cy="35" rx="9" ry="9" fill="#ecfdf5" />
    <ellipse cx="26" cy="35" rx="6" ry="6" fill="#a7f3d0" fill-opacity="0.6" />
  </g>

  <!-- Crispy Golden Puffed Cracker Wafer (Overlapping on Right) -->
  <g filter="url(#shadow)">
    <!-- Puffed Cracker Body -->
    <rect x="30" y="15" width="23" height="31" rx="6" transform="rotate(18 41.5 30.5)" fill="url(#crackerGrad)" stroke="#b45309" stroke-width="1.2" />
    
    <!-- Cracker texture bubbles & blisters -->
    <ellipse cx="40" cy="24" rx="2.5" ry="1.5" transform="rotate(18 40 24)" fill="#fef9c3" fill-opacity="0.8" />
    <ellipse cx="45" cy="33" rx="3" ry="2" transform="rotate(18 45 33)" fill="#fef9c3" fill-opacity="0.8" />
    <ellipse cx="37" cy="36" rx="2" ry="1.5" transform="rotate(18 37 36)" fill="#fef08a" fill-opacity="0.7" />
    <circle cx="44" cy="27" r="1.2" fill="#d97706" fill-opacity="0.5" />
    <circle cx="39" cy="30" r="1" fill="#d97706" fill-opacity="0.5" />
  </g>

  <!-- Lab Innovation Sparkles ✨ -->
  <g fill="url(#starGrad)" filter="url(#shadow)">
    <!-- Main Sparkle Star (Top Right) -->
    <path d="M51 9 C51 12, 53 14, 56 14 C53 14, 51 16, 51 19 C51 16, 49 14, 46 14 C49 14, 51 12, 51 9 Z" />
    <!-- Small Sparkle Star (Bottom Left) -->
    <path d="M12 21 C12 23, 13.5 24, 15.5 24 C13.5 24, 12 25, 12 27 C12 25, 10.5 24, 8.5 24 C10.5 24, 12 23, 12 21 Z" />
  </g>
</svg>
